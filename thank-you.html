<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - Gramina Organic Farm</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    .thank-you-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 2rem;
    }

    .thank-you-content {
      max-width: 600px;
      margin: 0 auto;
    }

    .thank-you-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .thank-you-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #2b6b44;
      margin-bottom: 1rem;
    }

    .thank-you-content p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.8;
    }

    .back-home-btn {
      display: inline-block;
      padding: 12px 30px;
      background-color: #2b6b44;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .back-home-btn:hover {
      background-color: #1d4a2e;
    }

    @media (max-width: 768px) {
      .thank-you-container {
        min-height: 60vh;
        padding: 1.5rem;
      }

      .thank-you-icon {
        font-size: 3rem;
      }

      .thank-you-content h1 {
        font-size: 2rem;
      }

      .thank-you-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="thank-you-container">
      <div class="thank-you-content">
        <div class="thank-you-icon">✓</div>
        <h1>Thank You for Reaching Out!</h1>
        <p>We've received your message and appreciate you taking the time to contact us. Our team will review your inquiry and get back to you within 24 hours.</p>
        <p>In the meantime, feel free to explore more about our organic farm and products.</p>
        <a href="index.html" class="back-home-btn primary-btn">Back to Home</a>
      </div>
    </section>
  </main>
</body>
</html>
